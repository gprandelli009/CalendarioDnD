<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Dinamico - File Unico con Login</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .calendar-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 350px;
        }

        /* Nuovo stile per il modulo di login */
        .login-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 300px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .login-container input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; /* Assicura che il padding non aumenti la larghezza totale */
        }

        .login-container button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }
        
        .error-message {
            color: red;
            margin-top: 10px;
            height: 20px;
        }

        /* Intestazione e pulsanti di navigazione */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #current-month-year {
            font-size: 1.5em;
            color: #333;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #007bff;
            padding: 5px 10px;
            transition: color 0.3s;
        }

        .nav-btn:hover {
            color: #0056b3;
        }

        /* Griglia dei giorni della settimana e delle date */
        .calendar-weekdays, .calendar-dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* 7 colonne per i 7 giorni */
            text-align: center;
        }

        .calendar-weekdays > div {
            font-weight: bold;
            color: #555;
            padding-bottom: 10px;
        }

        .calendar-dates > div {
            padding: 10px 5px;
            border-radius: 5px;
            cursor: default;
        }

        /* Stile per i giorni del mese corrente */
        .current-month-day {
            color: #333;
            transition: background-color 0.2s;
        }

        .current-month-day:hover:not(.today) {
            background-color: #eee;
        }

        /* Stile per il giorno odierno: EVIDENZIATO */
        .today {
            background-color: **#007bff**;
            color: **white**;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.5);
        }

        /* Stile per i giorni non appartenenti al mese visualizzato */
        .other-month-day {
            color: #ccc;
        }
        
        /* Stile per mostrare l'utente loggato e il logout */
        #user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #555;
        }
        
        #logout-btn {
            background: none;
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        
        #logout-btn:hover {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-container" id="login-screen">
        <h2>Accesso al Calendario 🗓️</h2>
        <p>Inserisci il tuo nome:</p>
        <input type="text" id="username-input" placeholder="Esempio: Marco" required>
        <button id="login-btn">Accedi</button>
        <div class="error-message" id="error-msg"></div>
        <p style="margin-top: 15px; font-size: 0.85em; color: #777;">
            Utenti validi: Dalila, Marco, Paolo, Gabriele, Federica, Luca, Master
        </p>
    </div>

    <div class="calendar-container" id="calendar-screen" style="display:none;">
        <div id="user-info">
            <span>Accesso come: **<span id="logged-in-user"></span>**</span>
            <button id="logout-btn">Logout</button>
        </div>
        
        <div class="calendar-header">
            <button id="prev-btn" class="nav-btn">←</button>
            <h2 id="current-month-year"></h2>
            <button id="next-btn" class="nav-btn">→</button>
        </div>

        <div class="calendar-weekdays">
            <div>Dom</div>
            <div>Lun</div>
            <div>Mar</div>
            <div>Mer</div>
            <div>Gio</div>
            <div>Ven</div>
            <div>Sab</div>
        </div>

        <div class="calendar-dates" id="calendar-dates">
        </div>
    </div>

    <script>
        // Variabili globali per tenere traccia della data visualizzata
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth(); // 0-11
        let loggedInUser = null; // Stato dell'utente loggato

        // Array degli utenti validi (in minuscolo per una verifica case-insensitive)
        const VALID_USERS = [
            "dalila", "marco", "paolo", "gabriele", "federica", "luca", "master"
        ];

        // Riferimenti agli elementi HTML
        const loginScreen = document.getElementById('login-screen');
        const calendarScreen = document.getElementById('calendar-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const errorMsg = document.getElementById('error-msg');
        const loggedInUserSpan = document.getElementById('logged-in-user');
        
        const monthYearDisplay = document.getElementById('current-month-year');
        const datesContainer = document.getElementById('calendar-dates');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // Array con i nomi dei mesi in italiano
        const monthNames = [
            "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
            "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
        ];

        /**
         * Funzione per mostrare il calendario e nascondere il login (o viceversa).
         */
        function updateUI() {
            if (loggedInUser) {
                // Utente loggato: mostra il calendario
                loginScreen.style.display = 'none';
                calendarScreen.style.display = 'block';
                loggedInUserSpan.textContent = loggedInUser;
                renderCalendar();
            } else {
                // Utente disconnesso: mostra il login
                loginScreen.style.display = 'block';
                calendarScreen.style.display = 'none';
                usernameInput.value = ''; // Pulisci il campo input
                errorMsg.textContent = ''; // Pulisci l'errore
            }
        }
        
        /**
         * Gestisce il tentativo di login.
         */
        function handleLogin() {
            const username = usernameInput.value.trim();
            
            if (username === "") {
                errorMsg.textContent = "Per favore, inserisci il tuo nome.";
                return;
            }

            // Normalizza il nome inserito per il confronto (es. "marco" vs "Marco")
            const normalizedUsername = username.toLowerCase();

            if (VALID_USERS.includes(normalizedUsername)) {
                // Login riuscito
                // Capitalizza la prima lettera per visualizzarla bene (es. "marco" -> "Marco")
                loggedInUser = username.charAt(0).toUpperCase() + username.slice(1).toLowerCase();
                updateUI();
            } else {
                // Login fallito
                errorMsg.textContent = "Nome utente non riconosciuto. Riprova.";
            }
        }

        /**
         * Gestisce il logout.
         */
        function handleLogout() {
            loggedInUser = null;
            updateUI();
        }

        /**
         * Funzione principale per disegnare il calendario
         */
        function renderCalendar() {
            // ... (logica del calendario esistente) ...
            
            // 1. Aggiorna l'intestazione
            monthYearDisplay.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // 2. Calcola i parametri del mese
            const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
            // Giorno della settimana (0=Dom, 6=Sab) del primo giorno del mese
            const firstDayIndex = firstDayOfMonth.getDay(); 
            // Ultimo giorno del mese visualizzato (passando 0 al giorno successivo)
            const lastDayOfMonth = new Date(currentYear, currentMonth + 1, 0);
            const daysInMonth = lastDayOfMonth.getDate();

            // Rimuovi le date precedenti
            datesContainer.innerHTML = '';

            // Data odierna per l'evidenziazione
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;
            const todayDate = today.getDate();

            // 3. Aggiungi i giorni di "riempimento" (del mese precedente)
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('other-month-day');
                datesContainer.appendChild(emptyDiv);
            }

            // 4. Aggiungi i giorni del mese corrente
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = day;
                dayDiv.classList.add('current-month-day');

                // Controlla se è il giorno odierno e lo evidenzia
                if (isCurrentMonth && day === todayDate) {
                    dayDiv.classList.add('today');
                }

                datesContainer.appendChild(dayDiv);
            }
        }

        /**
         * Gestisce la navigazione al mese precedente
         */
        prevBtn.addEventListener('click', () => {
            if (loggedInUser) {
                if (currentMonth === 0) {
                    currentMonth = 11;
                    currentYear--;
                } else {
                    currentMonth--;
                }
                renderCalendar();
            }
        });

        /**
         * Gestisce la navigazione al mese successivo
         */
        nextBtn.addEventListener('click', () => {
            if (loggedInUser) {
                if (currentMonth === 11) {
                    currentMonth = 0;
                    currentYear++;
                } else {
                    currentMonth++;
                }
                renderCalendar();
            }
        });
        
        // Listener per i pulsanti di Login/Logout
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        
        // Permetti l'accesso premendo "Invio" nel campo di testo
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // Avvia l'interfaccia utente al caricamento della pagina
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
